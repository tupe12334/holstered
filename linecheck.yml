# yaml-language-server: $schema=https://raw.githubusercontent.com/tupe12334/linecheck/main/schema/linecheck.schema.json

rules:
  - pattern: "**/*.rs"
    error: 50
    error_message: "File exceeds 50 lines — split it up"

exclude:
  - "Cargo.lock"
  - "target/**"
  # Recorded by the eval (evals/README.md), not written by hand.
  - "evals/cassettes/**"
