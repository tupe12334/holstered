<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>How holstered works</title>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .step { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .hol { fill: #fbf1eb; stroke: #CC6630; stroke-width: 2; }
    .skip { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .t { fill: #1f2328; font-size: 15px; }
    .s { fill: #59636e; font-size: 13px; }
    .h { fill: #A5451C; font-size: 15px; font-weight: 600; }
    .n { fill: #CC6630; font-size: 13px; font-weight: 700; }
    .a { stroke: #59636e; stroke-width: 1.8; fill: none; }
    .d { stroke: #8c959f; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    .dhead { fill: #8c959f; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #3d444d; }
      .step { fill: #0d1117; stroke: #3d444d; }
      .hol { fill: #2a1a12; stroke: #e0804c; }
      .skip { fill: #161b22; stroke: #6e7681; }
      .t { fill: #e6edf3; }
      .s { fill: #9198a1; }
      .h { fill: #f0a070; }
      .n { fill: #e0804c; }
      .a { stroke: #9198a1; }
      .d { stroke: #6e7681; }
      .head { fill: #9198a1; }
      .dhead { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0 0L10 5L0 10z"/></marker>
    <marker id="dh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dhead" d="M0 0L10 5L0 10z"/></marker>
  </defs>
  <rect class="bg" width="720" height="560" rx="12"/>

  <rect class="box" x="40" y="20" width="360" height="44" rx="8"/>
  <text class="t" x="220" y="47" text-anchor="middle">user prompt</text>
  <path class="a" d="M220 64V86" marker-end="url(#ah)"/>

  <rect class="box" x="40" y="88" width="360" height="52" rx="8"/>
  <text class="t" x="220" y="110" text-anchor="middle">agent prompt hook</text>
  <text class="s m" x="220" y="128" text-anchor="middle">UserPromptSubmit · BeforeAgent · pre_llm_call</text>
  <path class="a" d="M220 140V162" marker-end="url(#ah)"/>

  <rect class="hol" x="20" y="164" width="400" height="302" rx="12"/>
  <text class="h" x="40" y="188">holstered</text>

  <rect class="step" x="40" y="198" width="360" height="52" rx="8"/>
  <text class="n" x="56" y="220">1</text>
  <text class="t" x="76" y="220">polyhook</text>
  <text class="s" x="76" y="238">detect agent, read prompt</text>
  <path class="a" d="M220 250V264" marker-end="url(#ah)"/>

  <rect class="step" x="40" y="266" width="360" height="52" rx="8"/>
  <text class="n" x="56" y="288">2</text>
  <text class="t" x="76" y="288">BM25 over name + description</text>
  <text class="s" x="76" y="306">shortlist top 20 skills</text>
  <path class="a" d="M220 318V332" marker-end="url(#ah)"/>

  <rect class="step" x="40" y="334" width="360" height="52" rx="8"/>
  <text class="n" x="56" y="356">3</text>
  <text class="t" x="76" y="356">Jev (hosted) or Kev (local)</text>
  <text class="s" x="76" y="374">pick one or "none", + runners-up ≥ threshold</text>
  <path class="a" d="M220 386V400" marker-end="url(#ah)"/>

  <rect class="step" x="40" y="402" width="360" height="52" rx="8"/>
  <text class="n" x="56" y="424">4</text>
  <text class="t" x="76" y="424">polyhook</text>
  <text class="s" x="76" y="442">inject <tspan class="m">SKILL.md</tspan> in the agent's format</text>
  <path class="a" d="M220 466V492" marker-end="url(#ah)"/>

  <rect class="box" x="40" y="494" width="360" height="44" rx="8"/>
  <text class="t" x="220" y="521" text-anchor="middle">model sees the skills this turn</text>

  <path class="d" d="M400 360H468" marker-end="url(#dh)"/>
  <rect class="skip" x="470" y="310" width="230" height="100" rx="8"/>
  <text class="t" x="486" y="334">nothing injected</text>
  <text class="s" x="486" y="356">"none", unknown skill,</text>
  <text class="s" x="486" y="374">error, or timeout (8s)</text>
  <text class="s" x="486" y="396">prompt passes untouched</text>
  <path class="d" d="M585 410V516H402" marker-end="url(#dh)"/>
</svg>
