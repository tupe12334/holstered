name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Require the tag to match Cargo.toml and gemini-extension.json
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          [ "v$crate_version" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME != Cargo.toml v$crate_version"; exit 1; }
          extension_version=$(jq -r .version gemini-extension.json)
          [ "$extension_version" = "$crate_version" ] \
            || { echo "::error::gemini-extension.json $extension_version != Cargo.toml $crate_version"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  homebrew:
    name: Bump Homebrew formula
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      # Write access to tupe12334/homebrew-tap only, via a deploy key.
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Point the formula at this tag and push
        run: |
          brew tap tupe12334/tap
          tap="$(brew --repo tupe12334/tap)"
          git -C "$tap" config user.name "github-actions[bot]"
          git -C "$tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          brew bump-formula-pr --write-only --commit --no-audit \
            --url "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" \
            tupe12334/tap/holstered
          git -C "$tap" push git@github.com:tupe12334/homebrew-tap.git HEAD:main

  npm-build:
    name: Build ${{ matrix.target }} for npm
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - if: matrix.zig
        run: pip install ziglang
      - run: cargo ${{ matrix.zig && 'zigbuild' || 'build' }} --locked --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/holstered${{ matrix.ext }}
          if-no-files-found: error

  npm:
    name: Publish to npm
    needs: [publish, npm-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-npm

      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: artifacts
      - name: Stage binaries where cargo-npm looks for them
        run: |
          for dir in artifacts/npm-*; do
            target="${dir#artifacts/npm-}"
            mkdir -p "target/$target/release"
            mv "$dir"/* "target/$target/release/"
            chmod +x target/"$target"/release/*
          done

      - run: cargo npm generate

      - name: Smoke-test the packed install on linux-x64
        run: |
          smoke="$(mktemp -d)"
          npm pack --pack-destination "$smoke" ./npm/holstered ./npm/@holstered/holstered-linux-x64
          cd "$smoke"
          npm init -y >/dev/null
          npm install --no-audit --no-fund ./*.tgz
          out=$(./node_modules/.bin/holstered --version)
          echo "$out"
          [ "$out" = "holstered ${GITHUB_REF_NAME#v}" ]

      # Platform packages first, then `holstered`; already-published versions are skipped.
      - run: cargo npm publish

  github-release:
    name: GitHub Release and Go module tag
    needs: [publish, npm-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and push the go/ tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: artifacts

      # The Go wrapper (go/cmd/holstered) downloads these by GOOS-GOARCH name.
      - name: Name binaries for the Go wrapper
        run: |
          mkdir dist
          while read -r triple asset; do
            src=$(ls artifacts/npm-"$triple"/*)
            cp "$src" "dist/$asset"
          done <<'MAP'
          x86_64-unknown-linux-musl holstered-linux-amd64
          aarch64-unknown-linux-musl holstered-linux-arm64
          x86_64-apple-darwin holstered-darwin-amd64
          aarch64-apple-darwin holstered-darwin-arm64
          x86_64-pc-windows-msvc holstered-windows-amd64.exe
          MAP
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      # `go install .../go/cmd/holstered@vX.Y.Z` resolves the go/vX.Y.Z tag.
      - run: |
          git tag "go/$GITHUB_REF_NAME" "$GITHUB_SHA"
          git push origin "go/$GITHUB_REF_NAME"
