[package]
name = "holstered"
version = "0.1.0"
edition = "2021"
description = "Hands your coding agent the right skill for each prompt: BM25 recall + the Jev decision model, over polyhook"
license = "MIT"
repository = "https://github.com/tupe12334/holstered"

[dependencies]
bm25 = "2.3.2"
dirs = "7.0.0"
gray_matter = "0.3.2"
# ponytail: git pin until polyhook/polyhook#73 (prompt:submit + context response) and #74 (Codex) are released on crates.io.
polyhook = { git = "https://github.com/polyhook/polyhook", branch = "feat/codex-caller" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
mockito = "1.7.2"
tempfile = "3"

[profile.release]
strip = true
lto = true
