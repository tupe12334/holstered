[package]
name = "holstered"
version = "1.3.0"
edition = "2021"
description = "Hands your coding agent the right skill for each prompt: BM25 recall + the Jev decision model, over polyhook"
license = "MIT"
repository = "https://github.com/tupe12334/holstered"
homepage = "https://github.com/tupe12334/holstered"
readme = "README.md"
keywords = ["claude-code", "codex", "agent", "skills", "hooks"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "assets/", "evals/", "go/", "linecheck.yml"]

# npm: `holstered` + one @holstered/holstered-<os>-<cpu> package per target
# (optionalDependencies), built by release.yml with cargo-npm.
[package.metadata.npm]
name = "holstered"
prefix = "@holstered/holstered-"
targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
]
custom = { publishConfig = { access = "public", provenance = true } }

[dependencies]
bm25 = "2.3.2"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
gray_matter = "0.3.2"
polyhook = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
walkdir = "2.5.0"

[[test]]
name = "eval"
path = "evals/eval.rs"

[dev-dependencies]
assert_cmd = "2.2.2"
mockito = "1.7.2"
tempfile = "3"

[profile.release]
strip = true
lto = true
