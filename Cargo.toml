[package]
name = "holstered"
version = "1.0.0"
edition = "2021"
description = "Hands your coding agent the right skill for each prompt: BM25 recall + the Jev decision model, over polyhook"
license = "MIT"
repository = "https://github.com/tupe12334/holstered"
homepage = "https://github.com/tupe12334/holstered"
readme = "README.md"
keywords = ["claude-code", "codex", "agent", "skills", "hooks"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "linecheck.yml"]

[dependencies]
bm25 = "2.3.2"
dirs = "7.0.0"
gray_matter = "0.3.2"
polyhook = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
mockito = "1.7.2"
tempfile = "3"

[profile.release]
strip = true
lto = true
